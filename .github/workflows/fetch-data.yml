name: 每日更新股票資料

"on":
  schedule:
    - cron: "0 23 * * *" # UTC 23:00 = 台灣時間早上 7:00
  workflow_dispatch: {} # 允許手動觸發，方便測試

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安裝套件
        run: pip install -r requirements-fetch.txt

      - name: 還原 Firebase 服務帳戶金鑰
        run: echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > firebase-service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: 抓股票清單
        run: python src/backend/stock_list.py

      # 先抓收藏股票的深度資料（使用者最在意的），跑完會記錄用掉的 FinMind 次數，
      # 下一步的全市場輪抓才知道還剩多少額度（兩者共用每日 600 次上限）
      - name: 抓收藏股票的深度資料
        run: python src/backend/deep_fetcher.py
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_PATH: ./firebase-service-account.json

      - name: 抓全市場資料並存進 Firestore
        run: python src/backend/data_fetcher.py
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_PATH: ./firebase-service-account.json
